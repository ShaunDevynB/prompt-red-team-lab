name: Red-Team Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the test prompts against HelpBot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/runner.py

      - name: Score the results
        run: python src/scorer.py

      - name: Show the report on the run page
        if: always()
        run: cat results/report.md >> $GITHUB_STEP_SUMMARY

      - name: Save the results as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          path: results/